# Phase 1 mission geometry: the FORMATION_24H_J2 dynamics plus illumination
# (Sun, cylindrical Earth shadow) and geometry-only science opportunities.
# Regions are a SYNTHETIC grid (not data-informed; that is Phase 4).
schema_version: 1
scenario_id: MISSION_GEOMETRY_24H
description: >-
  Phase 1 mission geometry. FORMATION_24H_J2 dynamics, illumination, and region
  access opportunities on a synthetic 16-region grid (spec §3.4 abstraction).
scenario_type: mission_geometry

time:
  epoch_utc: "2025-06-01T00:00:00Z"
  duration_s: 86400
  time_step_s: 10

random:
  seed: 1                              # unused (no stochastic elements); provenance only

dynamics:
  model: j2

reference_orbit:                       # mean elements, Earth equatorial frame
  mean_altitude_km: 525
  mean_inclination_deg: 97.5
  raan_deg: 0                          # LTAN ~07:25 at this epoch (summary.json)
  start_argument_of_latitude_deg: 0

formation:
  n_spacecraft: 4
  along_track_spacing_km: 20

output:
  trajectory_sample_interval_s: 60

science:
  min_elevation_deg: 20                # PROVISIONAL (DL-033)
  regions:                             # synthetic grid: lat +-20 (EIA crests, p4), +-60 (p3)
    - {region_id: REGION_01, latitude_deg: 60, longitude_deg: -135, priority: 3}
    - {region_id: REGION_02, latitude_deg: 60, longitude_deg: -45, priority: 3}
    - {region_id: REGION_03, latitude_deg: 60, longitude_deg: 45, priority: 3}
    - {region_id: REGION_04, latitude_deg: 60, longitude_deg: 135, priority: 3}
    - {region_id: REGION_05, latitude_deg: 20, longitude_deg: -135, priority: 4}
    - {region_id: REGION_06, latitude_deg: 20, longitude_deg: -45, priority: 4}
    - {region_id: REGION_07, latitude_deg: 20, longitude_deg: 45, priority: 4}
    - {region_id: REGION_08, latitude_deg: 20, longitude_deg: 135, priority: 4}
    - {region_id: REGION_09, latitude_deg: -20, longitude_deg: -135, priority: 4}
    - {region_id: REGION_10, latitude_deg: -20, longitude_deg: -45, priority: 4}
    - {region_id: REGION_11, latitude_deg: -20, longitude_deg: 45, priority: 4}
    - {region_id: REGION_12, latitude_deg: -20, longitude_deg: 135, priority: 4}
    - {region_id: REGION_13, latitude_deg: -60, longitude_deg: -135, priority: 3}
    - {region_id: REGION_14, latitude_deg: -60, longitude_deg: -45, priority: 3}
    - {region_id: REGION_15, latitude_deg: -60, longitude_deg: 45, priority: 3}
    - {region_id: REGION_16, latitude_deg: -60, longitude_deg: 135, priority: 3}
