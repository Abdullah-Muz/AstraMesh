[project]
name = "astramesh"
version = "0.1.0.dev0"
description = "Research platform for fault-tolerant decentralized spacecraft autonomy, intelligent mission planning, and space-weather resilience."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdullah Muzher" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
# Runtime dependencies. Add new ones per phase, and only when a tested
# requirement needs them (ASTRAMESH_MASTER_SPEC.md §11). Phase 1 adds Astropy
# (time scales, GCRS/ITRS; DL-020).
dependencies = [
    "astropy>=7.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyerfa>=2.0",
    "pyyaml>=6.0.2",
    "scipy>=1.14",
    "simpy>=4.1",
]

[project.urls]
Repository = "https://github.com/Abdullah-Muz/AstraMesh"

[project.scripts]
astramesh = "astramesh.cli:main"

[dependency-groups]
# Phase 4 storm-data pipeline (DL-062, DL-068): reads the GOES netCDF-4 (HDF5) files into
# the committed derived series. The simulator never imports it.
data = [
    "h5py>=3.16.0",
]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

# Phase 4 machine-learning benchmark (DL-064). Kept out of the runtime dependencies:
# the simulator and the agents never import them. PyTorch is the CPU-only build, needed
# only by PyOD's MO-GAAL; xgboost-cpu avoids the CUDA libraries of plain xgboost.
ml = [
    "pyod>=3.6.7",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1,<2.15",
    "xgboost-cpu>=3.4.1",
]

[tool.uv]
default-groups = ["data", "dev", "ml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "NPY",      # numpy-specific
    "RUF",      # ruff-specific
    "PT",       # pytest style
]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

# scikit-learn, PyOD, XGBoost (DL-064) and h5py (DL-068) ship no complete type information either.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "pyod", "pyod.*", "xgboost", "xgboost.*", "h5py", "h5py.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Astropy, pyerfa, NetworkX and SciPy ship no py.typed marker; treat them as untyped (Any) rather than
# analysing its sources. Our wrappers convert its outputs to typed NumPy arrays.
[[tool.mypy.overrides]]
module = ["astropy", "astropy.*", "erfa", "networkx", "networkx.*", "scipy", "scipy.*"]
ignore_missing_imports = true
