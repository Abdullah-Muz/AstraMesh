name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, type-check, test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy

      - name: Tests
        run: uv run --locked pytest

      - name: Toy scenario smoke run
        run: uv run --locked astramesh run configs/experiments/toy_heartbeat.yaml --out "$RUNNER_TEMP/toy"

      - name: Formation dynamics baseline (24 h, J2) smoke run and plots
        run: |
          uv run --locked astramesh run configs/experiments/formation_24h_j2.yaml --out "$RUNNER_TEMP/formation"
          uv run --locked astramesh plot "$RUNNER_TEMP/formation"

      - name: Mission geometry baseline (24 h) smoke run and plots
        run: |
          uv run --locked astramesh run configs/experiments/mission_geometry_24h.yaml --out "$RUNNER_TEMP/mission"
          uv run --locked astramesh plot "$RUNNER_TEMP/mission"

      - name: Agent network baseline (24 h) smoke run
        run: uv run --locked astramesh run configs/experiments/agent_network_24h.yaml --out "$RUNNER_TEMP/network"

      - name: Nominal operations S00 with B0 (24 h) smoke run
        run: uv run --locked astramesh run configs/experiments/nominal_ops_b0_24h.yaml --out "$RUNNER_TEMP/ops"
